<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../css/style.css" />
    <title>Viper Rose</title>
  </head>
  <body>
    <h1>Viper Rose</h1>

    <!-- MAIN STORY LAYOUT -->
    <section class="story-layout">
      <!-- LEFT: story content -->
      <div class="story-main">
        <img
          src="assets/gallery/cover.jpg"
          alt="Viper Rose cover"
          class="story-cover"
        />

        <blockquote class="story-scripture">
          A tale of danger, beauty, and redemption through the rose thorns.
        </blockquote>

        <a href="scenes.html" class="nav-button">Read scenes</a>
      </div>

      <!-- RIGHT: guide + characters -->
      <aside class="story-guide">
        <p class="guide-text">
          Notes, narration, quick thoughts, emotional guide. This space is
          allowed to be messy.
        </p>
      </aside>
    </section>

    <!-- GALLERY -->
    <section class="story-gallery">
      <img src="assets/gallery/1.jpg" alt="" />
      <img src="assets/gallery/2.jpg" alt="" />
      <img src="assets/gallery/3.jpg" alt="" />
    </section>

    <a href="../../index.html" class="nav-back"> ← Back to all stories </a>
    <script src="../../js/gallery-modal.js" defer></script>
  </body>
</html>
